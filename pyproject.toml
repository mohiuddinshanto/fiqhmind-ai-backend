[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiqhmind-backend"
version = "0.1.0"
description = "FiqhMind AI backend — multilingual RAG over the Arabic Hanafi Fiqh corpus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.4,<26",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<6",
    "qdrant-client>=1.9,<2",
    "celery>=5.4,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
